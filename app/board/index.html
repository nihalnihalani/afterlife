<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterlife</title>
<style>
  :root {
    --bg: #0d0b12; --panel: #17141f; --line: #2a2536; --text: #e9e4f2; --muted: #9a91ab;
    --run: #7ee0a1; --lost: #ff5d6c; --hand: #ffb547; --done: #6fb8ff; --fail: #b8324a; --queue: #7c7390;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; letter-spacing: .08em; }
  h1 small { font-size: 12px; color: var(--muted); letter-spacing: 0; font-weight: 400; margin-left: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .badge.warn { color: #fff; background: var(--fail); border-color: var(--fail); }
  .badge.ok::before { content: "● "; color: var(--run); }
  .badge.bad::before { content: "● "; color: var(--lost); }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; padding: 14px 18px; }
  .card .content { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 320px; display: flex; flex-direction: column; gap: 8px; transition: border-color .3s, box-shadow .3s; }
  .card.lost { border-color: var(--lost); box-shadow: 0 0 22px #ff5d6c40; }
  .card.handing-off { border-color: var(--hand); }
  .card.done { border-color: var(--done); }
  .card.failed { border-color: var(--fail); }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .title { font-weight: 600; }
  .status { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; color: #120f18; background: var(--queue); text-transform: uppercase; }
  .status.running { background: var(--run); } .status.lost { background: var(--lost); } .status.handing-off { background: var(--hand); }
  .status.done { background: var(--done); } .status.failed { background: var(--fail); color: #fff; }
  .meta { color: var(--muted); font-size: 12px; }
  .lease { height: 8px; background: #241f2e; border-radius: 4px; overflow: hidden; }
  .lease > div { height: 100%; background: var(--run); transition: width .25s linear, background .25s; }
  .ledger { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; overflow: auto; max-height: 360px; }
  .ledger li { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; }
  .ledger li.handed { border-left-color: var(--hand); }
  .ledger .who { font-size: 11px; color: var(--muted); }
  .ledger .chips span { font-size: 10px; border: 1px solid var(--hand); color: var(--hand); border-radius: 99px; padding: 0 6px; margin-right: 4px; }
  .ledger .pending { color: var(--muted); font-style: italic; }
  .ledger .draft { color: var(--fg, #e8e8f0); }
  .ledger .draft::after { content: "▍"; color: var(--run); animation: blink 1s steps(1) infinite; }
  .ledger .cut { color: var(--lost); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.25); }
  .ledger .cut::after { content: " ✕"; }
  .ledger .chips span.continued { border-color: var(--lost); color: var(--lost); }
  .takeover { font-size: 12px; color: var(--hand); }
  @keyframes blink { 50% { opacity: 0; } }
  .rejections { font-size: 12px; color: #fff; background: #5a1622; border: 1px solid var(--lost); border-radius: 6px; padding: 4px 8px; }
  .directives { font-size: 12px; color: var(--hand); }
  .timeline { font-size: 11px; color: var(--muted); white-space: pre-line; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: auto; }
  .steer { display: flex; gap: 6px; }
  .steer input { flex: 1; background: #0f0d14; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .steer button { background: var(--hand); color: #120f18; border: 0; border-radius: 6px; padding: 5px 10px; font-weight: 600; cursor: pointer; }
  section.feed { margin: 0 18px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  section.feed h2 { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
  #feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; gap: 3px; max-height: 220px; overflow: auto; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chip { display: inline-block; min-width: 70px; font-weight: 700; }
  .chip.CKPT { color: var(--run); } .chip.LOST { color: var(--lost); } .chip.HANDOFF { color: var(--hand); } .chip.DONE { color: var(--done); } .chip.STEER { color: #d58cff; }
  .chip.TOOK { color: var(--hand); } .chip.TOMBSTONE { color: var(--muted); } .chip.ACK { color: #8ff0e0; } .chip.REVIEW { color: #f0d98f; } .chip.REACT { color: #c9c2d6; }
  .empty { padding: 40px 18px; color: var(--muted); }
  /* A lost task is a ghost until someone takes it over. */
  .card.lost .content { filter: grayscale(.55) opacity(.75); }
  .status.lost::before { content: "👻 "; }
  .card .why { font-size: 12px; color: var(--lost); font-weight: 600; }
  .takeover b { color: var(--text); }
  #controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); background: #110e17; }
  #controls .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #controls .label { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .agent { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 2px 4px 2px 8px; font-size: 12px; }
  .agent .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--run); }
  .agent.dead { opacity: .5; text-decoration: line-through; } .agent.dead .dot { background: var(--lost); }
  .agent.frozen .dot { background: #8fc7ff; } .agent.hung .dot { background: var(--hand); }
  .agent button, #controls > .group > button { background: #241f2e; color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-size: 11px; padding: 2px 6px; cursor: pointer; }
  .agent button:hover, #controls button:hover { border-color: var(--hand); }
  #controls button.story { background: var(--hand); color: #120f18; font-weight: 700; padding: 4px 12px; font-size: 12px; }
  #caption { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(900px, 92vw); background: #000c; border: 1px solid var(--hand); color: #fff; font-size: 20px; line-height: 1.35; padding: 12px 18px; border-radius: 10px; text-align: center; display: none; z-index: 10; box-shadow: 0 8px 40px #000; }
  footer { padding: 0 18px 18px; display: flex; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<header>
  <h1>AFTERLIFE <small>when an agent dies, its work doesn't</small></h1>
  <span class="badge" id="llm">LLM …</span>
  <span class="badge" id="a2a">agent-to-agent messages: 0</span>
  <span class="badge" id="ws">actors ws</span>
  <span class="badge" id="sse">bridge feed</span>
</header>
<section id="controls">
  <div class="group" id="roster"><span class="label">AGENTS</span><span class="meta">control offline (scripts/demo.sh up starts it)</span></div>
  <div class="group"><span class="label">SUPERVISOR</span><button data-chaos="kill" data-agent="bridge">kill bridge</button><button data-chaos="bridge-start">start bridge</button></div>
  <div class="group"><button data-chaos="new-run">new run</button><button class="story" id="story">▶ Story</button></div>
</section>
<main id="cards"><div class="empty">Loading run…</div></main>
<section class="feed"><h2>AGENT RELAY · #fleet, threads, DMs and reactions</h2><ul id="feed"></ul></section>
<footer><span class="badge" id="run">run …</span><span class="badge" id="transport">transport …</span><span class="badge" id="pace"></span><span class="badge warn">DATA: SYNTHETIC</span></footer>
<div id="caption"></div>
<script>
  const SECTIONS = ["Arrival", "Ground floor", "Upper floors", "The anomaly", "Witness accounts", "Conclusion"]
  const state = {}
  const steerForms = {}
  const downWindows = [] // [start, end] periods when the bridge feed was offline
  let run = null
  const $ = id => document.getElementById(id)
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
  const short = name => (name || "").replace(run.runId + "-", "")
  const setBadge = (id, text, cls) => { const b = $(id); b.textContent = text; b.className = "badge " + (cls || "") }
  const whileBridgeDown = at => downWindows.some(([a, b]) => at >= a && at <= (b ?? Infinity))

  async function boot() {
    try { const res = await fetch("/api/run"); if (!res.ok) throw new Error(); run = await res.json() } catch { $("cards").replaceChildren(el("div", "empty", "Bridge offline. Start the bridge; this page retries.")); return setTimeout(boot, 2000) }
    setBadge("run", "run " + run.runId)
    setBadge("transport", "transport: " + run.transport.toUpperCase(), run.transport === "poll" ? "warn" : "")
    setBadge("llm", "LLM: " + (run.llmMode === "openai" ? "OPENAI " + run.model : "CANNED"), run.llmMode === "openai" ? "" : "warn")
    setBadge("pace", run.stepPaceMs ? "pace " + (run.stepPaceMs / 1000) + "s/step" : "")
    $("cards").replaceChildren()
    for (const t of run.tasks) state[t.id] = { taskId: t.id, title: t.title, status: "queued", ledger: [], rejections: [], timeline: [], directives: [] }
    render()
    connectActors()
    connectFeed()
    pollAgents()
  }

  // ---- Demo controls (scripts/control.ts): fault injection with buttons, and a narrated story.
  const controlUrl = path => "http://127.0.0.1:" + (run.controlPort || 3001) + path
  async function chaos(action, agent) {
    try { await fetch(controlUrl("/chaos"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, agent }) }) } catch {}
    if (action === "new-run") setTimeout(() => location.reload(), 4500)
    setTimeout(pollAgentsOnce, 300)
  }
  document.addEventListener("click", ev => {
    const b = ev.target.closest("button[data-chaos]")
    if (b) chaos(b.dataset.chaos, b.dataset.agent)
  })
  const ACTIONS = { worker: [["kill", "kill -9"], ["freeze", "freeze"], ["resume", "resume"], ["hang", "hang"]] }
  async function pollAgentsOnce() {
    let data
    try { data = await (await fetch(controlUrl("/agents"))).json() } catch { return }
    const roster = $("roster")
    roster.replaceChildren(el("span", "label", "AGENTS"))
    for (const a of data.agents) {
      if (a.name === "bridge" || a.name === "reviewer") continue
      const chip = el("span", "agent " + a.state)
      chip.append(el("span", "dot"), el("span", "", a.name + (a.state === "alive" ? "" : " · " + a.state)))
      if (a.state !== "dead") for (const [action, label] of ACTIONS.worker) {
        if (action === "resume" && a.state !== "frozen") continue
        if (action === "freeze" && a.state === "frozen") continue
        const btn = el("button", "", label); btn.dataset.chaos = action; btn.dataset.agent = a.name; chip.append(btn)
      }
      roster.append(chip)
    }
    const reviewer = data.agents.find(a => a.name === "reviewer")
    if (reviewer) { const r = el("span", "agent " + reviewer.state); r.append(el("span", "dot"), el("span", "", "reviewer")); roster.append(r) }
  }
  function pollAgents() { pollAgentsOnce(); setInterval(pollAgentsOnce, 1000) }

  const caption = text => { const c = $("caption"); c.textContent = text; c.style.display = text ? "block" : "none" }
  const pause = ms => new Promise(r => setTimeout(r, ms))
  async function steerApi(taskId, text) {
    try { await fetch("/api/steer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ taskId, text }) }) } catch {}
  }
  // About 70 seconds. Each beat is a real fault injected into real processes; nothing is scripted
  // on the agent side. Run it a few seconds after a new run, while all three agents are writing.
  const STORY = [
    [0, "Three AI agents are each writing a field report. Every word streams into a Durable Actor that owns the task.", null],
    [4000, "A human steers w2 over Agent Relay: “write it like a ghost”. The actor records the instruction before it is delivered.", () => steerApi("t2", "write it like a ghost")],
    [4500, "Now kill -9 w2, and the supervisor too. No process is left to notice.", async () => { await chaos("kill", "w2"); await chaos("kill", "bridge") }],
    [2500, "Freeze w3 (kill -STOP). It will wake up later as a zombie.", () => chaos("freeze", "w3")],
    [2500, "Hang w1. It keeps heartbeating, so its lease looks healthy, but it stopped making progress.", () => chaos("hang", "w1")],
    [6500, "w2's lease ran out inside the actor. With no supervisor alive, the actor offered t2 to the standbys itself: one finished w2's half-written sentence, mid-word, and kept the human's instruction.", null],
    [9000, "w3 went silent too. And w1? Its heartbeat kept the lease full, but the actor's progress deadline flagged it STUCK, not dead. Every task has a new owner.", null],
    [7000, "Over Agent Relay the new owners announced each takeover, a reviewer agent checked continuity, and each owner ACKed. No supervisor relayed any of it.", null],
    [5000, "Wake the zombie w3. Its first write carries an old attempt number, and the actor rejects it.", () => chaos("resume", "w3")],
    [5000, "Bring the supervisor back. It reads Relay's history: everything the agents said to each other while it was dead.", () => chaos("bridge-start")],
    [8000, "", null],
  ]
  let storyRunning = false
  $("story").onclick = async () => {
    if (storyRunning) return
    storyRunning = true
    for (const [wait, text, act] of STORY) {
      await pause(wait)
      caption(text)
      if (act) await act()
    }
    storyRunning = false
  }

  // One WebSocket per Task actor. Any close (or failed handshake) triggers exactly one
  // reconnect of the whole group with a fresh grant, backing off 1 s -> 5 s.
  async function connectActors(delay = 1000) {
    let retried = false
    const sockets = []
    const retry = () => {
      if (retried) return
      retried = true
      for (const s of sockets) { s.onclose = null; s.close() }
      setBadge("ws", "actors ws: reconnecting (showing last known state)", "bad")
      setTimeout(() => connectActors(Math.min(delay * 2, 5000)), delay)
    }
    try {
      const res = await fetch("/api/grants")
      const grants = await res.json()
      if (!res.ok || !Array.isArray(grants)) throw new Error("bad grants")
      let open = 0
      for (const g of grants) {
        const ws = new WebSocket(g.websocketUrl)
        sockets.push(ws)
        ws.onopen = () => { if (++open === grants.length) { setBadge("ws", "actors ws", "ok"); delay = 1000 } }
        ws.onmessage = ev => {
          const msg = JSON.parse(ev.data)
          if (msg.type === "state") Object.assign(state[g.taskId], msg.state)
          else if (msg.type === "state_update") Object.assign(state[g.taskId], msg.changes)
          scheduleRender()
        }
        ws.onclose = retry
      }
    } catch { retry() }
  }

  // Messages one agent sends to another (or to the human) without any supervisor in between.
  const A2A = new Set(["TOOK", "TOMBSTONE", "ACK", "REVIEW", "REACT", "STEER"])
  let a2a = 0
  function connectFeed() {
    const es = new EventSource("/api/feed")
    es.onopen = () => {
      // The bridge replays its recent feed on every connect: start counting again.
      a2a = 0; setBadge("a2a", "agent-to-agent messages: 0"); $("feed").replaceChildren()
      const last = downWindows[downWindows.length - 1]
      if (last && last[1] == null) last[1] = Date.now()
      setBadge("sse", "bridge feed", "ok")
    }
    es.onerror = () => {
      const last = downWindows[downWindows.length - 1]
      if (!last || last[1] != null) downWindows.push([Date.now(), null])
      setBadge("sse", "bridge offline (cards still live via actors)", "bad")
    }
    es.onmessage = ev => {
      const item = JSON.parse(ev.data)
      if (A2A.has(item.type) && short(item.from) !== "human" && short(item.from) !== "bridge") {
        a2a++; setBadge("a2a", "agent-to-agent messages: " + a2a, "ok")
      }
      const li = el("li")
      li.append(el("span", "chip " + item.type, item.type), document.createTextNode(" " + new Date(item.at).toLocaleTimeString() + "  " + short(item.from) + " → " + short(item.to).replace("#" + run.channel, "#fleet") + "  " + item.text))
      $("feed").prepend(li)
    }
  }

  function rejectionText(r) {
    if (r.reason === "stale-attempt") return "✕ " + r.op + " from " + short(r.worker) + " rejected: stale attempt " + r.seenAttempt + " (current " + r.currentAttempt + ")"
    if (r.reason === "wrong-owner") return "✕ " + r.op + " from " + short(r.worker) + " rejected: not the owner of attempt " + r.currentAttempt
    return "✕ " + r.op + " from " + short(r.worker) + " rejected: " + r.reason + " (attempt " + r.seenAttempt + ", current " + r.currentAttempt + ")"
  }

  function steerFormFor(taskId) {
    if (steerForms[taskId]) return steerForms[taskId]
    const f = el("form", "steer"), input = el("input")
    input.maxLength = 200
    f.append(input, el("button", "", "Steer"))
    f.onsubmit = async ev => {
      ev.preventDefault()
      const text = input.value.trim()
      if (!text) return
      input.value = ""
      await fetch("/api/steer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ taskId, text }) })
    }
    return (steerForms[taskId] = f)
  }

  let pending = false
  // requestAnimationFrame pauses in a hidden tab, which would leave `pending` stuck; a timer
  // fallback keeps the board current wherever it is shown.
  function scheduleRender() {
    if (pending) return
    pending = true
    const run = () => { if (!pending) return; pending = false; render() }
    requestAnimationFrame(run)
    setTimeout(run, 120)
  }

  function render() {
    const now = Date.now()
    for (const t of run.tasks) {
      const s = state[t.id]
      let card = document.getElementById("card-" + t.id)
      if (!card) {
        card = el("div", "card"); card.id = "card-" + t.id
        card.append(el("div", "content"))
        $("cards").append(card)
      }
      card.className = "card " + s.status
      const content = card.firstChild
      content.replaceChildren()
      const top = el("div", "top")
      top.append(el("span", "title", t.id + " · " + (s.title || t.title)), el("span", "status " + s.status, s.status === "lost" ? "lost · " + (s.lostReason || "silent") : s.status))
      content.append(top)
      if (s.status === "lost") content.append(el("div", "why", s.lostReason === "stuck" ? short(s.lostWorker) + " was heartbeating but made no progress: the actor's progress deadline fired" : short(s.lostWorker) + " went silent: the lease alarm fired inside the actor"))
      const owner = s.status === "lost" ? "was " + short(s.lostWorker) + " · offered to standbys by the actor" : short(s.assignee) || "—"
      content.append(el("div", "meta", "owner " + owner + " · attempt " + (s.attempt || 0) + " · " + (s.ledger || []).length + "/" + (s.totalSteps || 6) + " steps"))
      const lease = el("div", "lease"), fill = el("div")
      const left = s.leaseDeadline ? Math.max(0, s.leaseDeadline - now) : 0
      const pct = s.status === "running" ? Math.min(100, (left / (s.activeLeaseMs || s.leaseMs || 10000)) * 100) : s.status === "done" ? 100 : 0
      fill.style.width = pct + "%"
      fill.style.background = s.status === "done" ? "var(--done)" : pct < 35 ? "var(--lost)" : pct < 65 ? "var(--hand)" : "var(--run)"
      lease.append(fill); content.append(lease)
      let leaseText = ""
      if (s.status === "running") leaseText = "lease " + (left / 1000).toFixed(1) + "s"
      if (s.lostAt) leaseText += (leaseText ? " · " : "") + "last lease expired " + new Date(s.lostAt).toLocaleTimeString() + (whileBridgeDown(s.lostAt) ? " while the bridge was down" : "")
      content.append(el("div", "meta", leaseText))
      const ul = el("ol", "ledger")
      let prevWorker = null
      for (const c of s.ledger || []) {
        const li = el("li", prevWorker && c.worker !== prevWorker ? "handed" : "")
        li.append(el("div", "who", c.stepId + " · " + SECTIONS[c.stepId - 1] + " · " + short(c.worker) + " (attempt " + c.attempt + ")"))
        if (c.continued) {
          // The first part of this step was written by an agent that died mid-sentence.
          const body = el("div")
          body.append(el("span", "cut", c.text.slice(0, c.continued.chars)), document.createTextNode(c.text.slice(c.continued.chars)))
          li.append(body)
        } else li.append(el("div", "", c.text))
        const chips = el("div", "chips")
        if (c.continued) chips.append(el("span", "continued", "finished " + short(c.continued.from) + "'s cut-off sentence"))
        if (c.callbacks && c.callbacks.length && prevWorker && c.worker !== prevWorker) for (const cb of c.callbacks) chips.append(el("span", "", cb))
        if (chips.childNodes.length) li.append(chips)
        prevWorker = c.worker
        ul.append(li)
      }
      const n = (s.ledger || []).length
      if (n < (s.totalSteps || 6) && s.status !== "failed") {
        const li = el("li")
        const label = s.status === "running" ? " · " + short(s.assignee) + " writing…" : s.status === "queued" ? " · waiting for a worker" : " · waiting for a standby to claim"
        li.append(el("div", "pending", (n + 1) + " · " + SECTIONS[n] + label))
        const cut = s.cutOff && s.cutOff.stepId === n + 1 ? s.cutOff : null
        const draft = s.draft && s.draft.stepId === n + 1 && s.status === "running" ? s.draft : null
        // While a successor types, its draft starts with the dead agent's text: strike that part.
        if (draft && cut && draft.text.startsWith(cut.text)) {
          const body = el("div", "draft")
          body.append(el("span", "cut", cut.text), document.createTextNode(draft.text.slice(cut.text.length)))
          li.append(body)
        } else if (draft) li.append(el("div", "draft", draft.text))
        else if (cut) li.append(el("div", "cut", cut.text + "  (" + short(cut.worker) + " died here)"))
        ul.append(li)
      }
      content.append(ul)
      ul.scrollTop = ul.scrollHeight
      if (s.takeover && s.takeover.attempt === s.attempt) {
        const tk = s.takeover
        const before = (s.ledger || []).filter(c => c.stepId < tk.atStep)
        const secs = before.reduce((sum, c) => sum + (c.ms || 0), 0) / 1000
        const cutStep = (s.ledger || []).find(c => c.stepId === tk.atStep && c.continued)
        const line = el("div", "takeover")
        line.append(
          document.createTextNode("↪ "), el("b", "", short(tk.to)),
          document.createTextNode(" took over from " + short(tk.from) + (tk.why === "stuck" ? " (stuck)" : " (silent)") + " at step " + tk.atStep +
            (tk.afterMs != null ? " · recovered in " + (tk.afterMs / 1000).toFixed(1) + "s, no supervisor" : "") +
            " · inherited " + before.length + " step" + (before.length === 1 ? "" : "s") + (secs ? " (" + secs.toFixed(0) + "s of agent work)" : "") +
            (cutStep ? " + a half-written sentence" : "") +
            ((s.directives || []).some(d => short(d.from) === "human") ? " + the human's instruction" : "")))
        content.append(line)
      }
      if ((s.directives || []).length) content.append(el("div", "directives", "directives: " + s.directives.map(d => "“" + d.text + "”").join(", ")))
      for (const r of (s.rejections || []).slice(-3)) content.append(el("div", "rejections", rejectionText(r)))
      const tl = (s.timeline || []).slice(-3)
      if (tl.length) content.append(el("div", "timeline", tl.map(e => new Date(e.at).toLocaleTimeString() + " " + e.kind + ": " + e.detail.replaceAll(run.runId + "-", "")).join("\n")))
      // The steer form lives outside the rebuilt content so typing survives live updates.
      if (run.steer) {
        const form = steerFormFor(t.id)
        form.style.display = s.status === "running" ? "" : "none"
        form.querySelector("input").placeholder = "steer " + short(s.assignee) + " (e.g. write it like a ghost)"
        if (form.parentNode !== card) card.append(form)
      }
    }
  }
  setInterval(() => { if (run) scheduleRender() }, 250)
  boot()
</script>
</body>
</html>
